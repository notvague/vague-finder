name: Claude 코드 리뷰

# PR이 열리거나 초안에서 Ready로 바뀔 때 한 번 리뷰한다.
# 다시 리뷰받으려면 PR에 "@claude review"로 시작하는 댓글을 단다 (쓰기 권한이 있는 팀원만).
# "@claude review" 댓글은 main에 있는 이 파일로 실행되므로, 머지한 뒤부터 동작한다.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # 포크 PR에는 secret이 전달되지 않으므로 같은 레포 브랜치의 PR만 자동 리뷰한다.
    if: >-
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '@claude review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: PR 정보
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" \
            --json number,headRefOid,baseRefName,isCrossRepository,state \
            --jq '"number=\(.number)\nhead=\(.headRefOid)\nbase=\(.baseRefName)\nfork=\(.isCrossRepository)\nstate=\(.state)"' \
            >> "$GITHUB_OUTPUT"

      # "@claude review" 댓글은 포크 PR에도 달 수 있어서 여기서 한 번 더 거른다.
      - name: 리뷰 대상 확인
        if: steps.pr.outputs.fork != 'false' || steps.pr.outputs.state != 'OPEN'
        run: echo "::notice::포크에서 온 PR이거나 열린 PR이 아니라 리뷰하지 않습니다."

      - uses: actions/checkout@v6
        if: steps.pr.outputs.fork == 'false' && steps.pr.outputs.state == 'OPEN'
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.pr.outputs.fork == 'false' && steps.pr.outputs.state == 'OPEN'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude GitHub App 대신 이 job의 토큰으로 코멘트를 단다 (위 permissions만큼만 쓸 수 있다).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR 번호: ${{ steps.pr.outputs.number }}
            기준 브랜치: origin/${{ steps.pr.outputs.base }}
            작업 폴더에는 PR의 최신 커밋이 체크아웃돼 있다.

            너는 Vague-Finder 팀의 코드 리뷰어다. Vague-Finder는 모호한 기억으로 노래를 찾는 멀티모달 음악 검색이다
            (FastAPI 백엔드, Qdrant 벡터 검색, MongoDB 가사 검색, Gemini 질의 분석).
            이 PR을 리뷰하고 결과를 PR에 남겨라. 모든 코멘트는 한국어로 쓴다.

            ## 순서
            1. `gh pr view <PR 번호> --comments`로 PR 설명과 기존 댓글을 읽는다. 이전 Claude 리뷰가 있으면 이미 지적한 내용은 반복하지 않는다.
            2. `git diff --stat origin/<기준 브랜치>...HEAD`로 바뀐 파일을 본다.
            3. 코드 변경은 `git diff origin/<기준 브랜치>...HEAD -- . ':(exclude)*.json' ':(exclude)*.jsonl' ':(exclude)*.csv' ':(exclude)*.npy' ':(exclude)*.npz' ':(exclude)*.gif' ':(exclude)*.png' ':(exclude)*.jpg' ':(exclude)artifacts/**' ':(exclude)experiments/**'`로 읽는다. 판단에 필요한 주변 코드는 Read·Grep으로 직접 확인한다.
            4. 문제마다 인라인 코멘트(mcp__github_inline_comment__create_inline_comment)를 남기고, 마지막에 `gh pr comment`로 요약 코멘트를 하나 남긴다.

            ## 리뷰하지 않는 파일
            데이터·산출물은 내용을 읽지 않는다: `*.json`, `*.jsonl`, `*.csv`, `*.npy`, `*.npz`, 이미지·GIF, `artifacts/`, `experiments/`.
            요약 코멘트에 "리뷰 제외" 목록으로 파일 이름만 적는다.

            ## 무엇을 볼까
            - 버그, 기존 동작을 깨는 변경, 빠진 예외 처리, 테스트를 깨뜨리는 변경
            - 공개 레포 유출: `docs/data_policy.md` 기준으로 원본 데이터(곡 목록, 가사 전문, 음원, `meta.json`, 앨범 커버, 댓글 원문)나 API 키·비밀값이 추가되면 [필수]
            - 측정 기준 파일: `experiments/reranking/eval_queries_v05.csv`, `analysis_cache_dev.json`, `analysis_cache_test.json`은 과거 숫자의 기준으로 얼려 둔 파일이라 바뀌면 [필수]
            - 질의 분석 프롬프트(`src/retrieval/query_analyzer.py`)가 바뀌면 분석 캐시가 무효가 되고 현재 검색 결과도 달라진다. PR 설명에 재측정 결과가 없으면 [권장]
            - 평가 질의(`experiments/reranking/eval_queries_v06.csv`)와 거의 같은 문장을 프롬프트 예시나 규칙에 넣으면 평가 누수라 [권장]
            - 주요 함수·엔드포인트의 타입 힌트, API 입출력의 Pydantic 스키마 검증
            - 스타일·포맷·이름 취향은 지적하지 않는다

            ## 코멘트 형식
            - 첫머리에 심각도를 붙인다: `[필수]` 머지 전에 고쳐야 함, `[권장]` 고치면 좋음, `[참고]` 알아 두면 좋음
            - 무엇이 문제인지, 어떤 입력에서 어떻게 틀리는지, 어떻게 고치면 되는지를 짧게 쓴다. 근거는 `파일:줄`로 댄다
            - 코드를 직접 확인해 확실한 것만 올린다. 추측은 올리지 않는다
            - 인라인 코멘트는 최대 10개다. 더 있으면 요약에 "외 N건"으로 적는다
            - PR을 승인하거나 변경을 요청하지 않는다. 코멘트만 남긴다

            ## 요약 코멘트
            - 첫 줄: `[필수] N · [권장] N · [참고] N`. 문제가 없으면 "머지를 막을 문제 없음"으로 시작한다
            - 핵심을 3줄 이내로 쓰고, 리뷰 제외 파일 목록을 붙인다
            - 마지막 줄: `— Claude 자동 리뷰 · 다시 받으려면 "@claude review" 댓글`
          # Pro 사용량을 아끼려고 Sonnet을 쓴다. 더 깊게 보려면 --model opus
          claude_args: |
            --model sonnet
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"
